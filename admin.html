<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Admin Panel</title>
  <style>
    body {
      font-family: Arial;
      padding: 40px;
    }

    input {
      font-size: 28px;
      padding: 10px;
      width: 300px;
    }

    button {
      font-size: 24px;
      padding: 10px 20px;
      margin-left: 10px;
    }
  </style>
</head>
<body>

<h1>🎓 Graduation Control Panel</h1>

<input type="text" id="studentID" placeholder="Scan or type ID">
<button onclick="sendStudent()">SHOW</button>

<script>
function sendStudent() {
  const id = document.getElementById("studentID").value;
  localStorage.setItem("currentStudent", id);
  document.getElementById("studentID").value = "";
</html>
